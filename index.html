<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css.css">
  </head>
  <body>
    <div class="load_" style="background: #0D0C18;">
      <img src="img/star.gif" class="load_star">
      <h1>Загрузка...</h1>
    </div>

    <div class="promocode">
      <div class="promocode_head">
        <h1>Промокод</h1>
      </div>
      <div class="promocode_text">
        <div class="top-text">
          <button class="back" onclick="document.querySelector('.promocode').style.display='none'"><- Назад</button>
          <h1 class="title">Введите промокод</h1>
        </div>
        <input type="text" placeholder="Промокод" class="input_promocode">
        <button class="but_promocode">Активировать</button>
      </div>

    </div>

    <div class="main_tel">
      <div class="head">
        <button class="but_promo_main" onclick="document.querySelector('.promocode').style.display='flex'"><img src="img/Gift.svg" class="img_but_promo_main">ПРОМОКОД</button>
        <img src="img/profile_img.jpg" class="img_profile_main">
        <button class="but_balance_main" onclick="window.location.href='settings.html'"><img src="img/Gram_logo.svg" class="img_but_gram_main">12.05 GRAM<img src="img/bet.svg" class="img_but_bet_main"></button>
      </div>
      <div class="slide">
        <img src="img/slide_1.jpg" class="slide_1" id="slide_1">
        <img src="img/slide_2.png" class="slide_1 hidden" id="slide_2"> <!-- разные картинки -->
        <img src="img/slide_3.png" class="slide_1 hidden" id="slide_3">

        <div class="slide_button">
          <button class="slide_but active" aria-pressed="true" id="slide_but_1"></button>
          <button class="slide_but" aria-pressed="false" id="slide_but_2"></button>
          <button class="slide_but" aria-pressed="false" id="slide_but_3"></button>
        </div>
      </div>
      <div class="head_text_event">
        <h1 class="text_event">Режимы</h1>
      </div>
      <div class="mini_game_">
        <button class="but_multiplier"><img src="img/multiplier.png" class="multiplier"></button>
        <button class="but_case"><img src="img/case.png" class="case"></button>
        <button class="but_event_create"><img src="img/event_create.png" class="event_create"></button>
      </div>
      <div class="futer">
        <button class="but_help"><img src="img/Gift.svg" class="img_but_help">ПОМОЩЬ</button>
        <button class="but_faq"><img src="img/Gift.svg" class="img_but_faq">FAQ</button>
      </div>
      <div class="futer_text">
        <h1>©SPIN GRAM</h1>
      </div>
    </div>

    <div class="warning_pc">
      <img src="img/moan.gif"class="img_warn_pc">
      <h1 class="head_text">Платформа доступена только с телефона</h1>
      <h1 class="sub_text">Запустите приложение с телефон или через <br> телеграм @spin_gram </h1>
    </div>


    <script>
      window.addEventListener('load', () => {
        const loader = document.querySelector('.load_');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.display = 'none';
          }, 300);
        }
      });
    </script>
    <script src="slide.js"></script>
    <script src="slide_img.js"></script>
  </body>
</html>
